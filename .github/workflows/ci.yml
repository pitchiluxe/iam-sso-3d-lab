name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run type-check

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test -- --run

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.2.1
          release_name: IAM SSO 3D Lab v0.2.1
          body: |
            ## IAM & SSO 3D Lab v0.2.1 — VM Desktop Fixes & New Apps

            ### What's new in v0.2.1
            - **Removed AIHub Browser** — it was bundled/pre-installed in prior builds; no longer shipped or referenced anywhere in the app
            - **New VM apps**: Settings (Windows-11-style, with a working Sound mute toggle and wallpaper picker — including an IAMLab dark wallpaper), classic-style Control Panel, and a Recycle Bin you can drag desktop icons onto to remove them
            - **Drag-to-reorder desktop icons**, arranged 6-per-column like a real desktop, with order and deletions persisted
            - Desk monitors in the 3D workspace now show a **Windows-style lock screen** (front face only — the back/sides are a plain dark bezel, not a wraparound texture), and desk chairs now actually face their monitor instead of showing their back to it
            - **Lab 1 is now actually completable end-to-end** — fixed two validators that could never be satisfied: step 3 (create the admin user) collided with a pre-seeded admin account, and step 4 (MFA policy) checked for an audit event the UI never emitted
            - **Step completion is now visible**: a step shows a brief greyed-out "Next Step" state before the AI supervisor auto-advances, instead of jumping instantly
            - Fixed the VM desktop **duplicating windows** every time you exited and re-entered (IAM Console/Objectives would pile up); already-open windows now also refresh instead of showing stale data after a lab reset
            - Fixed the IAM Console losing its scrollbar
            - Fixed the AI Supervisor chat silently falling back to canned hints on a cold local-Ollama model load; added a "thinking…" indicator while it's answering

            ### Features
            - 13 hands-on labs (IAM Foundation, JML, RBAC, SSO/SAML/OIDC, MFA, Access Reviews, Break/Fix, Incident Response, PAM, Capstone, Conditional Access, Hybrid Identity Sync, Break-Glass)
            - 3D virtual environment with interactive consoles, walk up to a monitor and press E to open the VM desktop
            - AI Supervisor (Socratic coaching via local Ollama LLM — never gives answers)
            - Full audit trail, evidence collection, scoring rubric (100 pts, 85 to pass)

            ### Run the installer
            Download `IAM-SSO-3D-Lab-Setup-0.2.1.exe` and run it on any Windows 10/11 64-bit machine.

            ### AI Supervisor setup
            1. Install [Ollama](https://ollama.com)
            2. Run: `ollama pull llama3.2`
            3. The AI tutor activates automatically when Ollama is reachable at http://localhost:11434
          draft: false
          prerelease: false

  release_installer:
    name: Build & Upload Installer (Windows)
    runs-on: windows-latest
    needs: [create_release, unit, build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Electron installer
        run: npm run build:desktop

      - name: Upload Windows installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: dist-installer/IAM SSO 3D Lab-Setup-0.2.1.exe
          asset_name: IAM-SSO-3D-Lab-Setup-0.2.1.exe
          asset_content_type: application/octet-stream

      - name: Upload 7z archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: dist-installer/iam-sso-3d-lab-0.2.1-x64.nsis.7z
          asset_name: iam-sso-3d-lab-0.2.1-x64.nsis.7z
          asset_content_type: application/x-7z-compressed