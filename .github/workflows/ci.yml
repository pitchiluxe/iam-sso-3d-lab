name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# create-release / upload-release-asset need write access to repo contents;
# the default GITHUB_TOKEN permissions on this repo are read-only, which was
# failing the release job with "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run type-check

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test -- --run

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # Releases are cut only when code lands on a trunk, never on a pull
    # request. This job deletes the existing release AND tag for the current
    # version before recreating them, so running it on a PR that does not bump
    # the version would destroy the live release for a shipped version — and
    # electron-builder declines to publish on a PR, so nothing would be
    # re-uploaded to replace it.
    if: github.event_name == 'push'
    # Gate the release on every test+build job passing. Otherwise an
    # early-failing E2E (or any other job) creates a release that
    # later passes can't recreate — `actions/create-release` fails with
    # "tag_name already_exists".
    needs: [lint, type-check, unit, build, e2e]
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from package.json
        id: get_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Delete any prior release with the same tag (idempotent)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -e
          # Delete prior release + remote tag if they exist. The
          # actions/create-release action creates a git tag automatically,
          # so we must delete both the release AND the tag for re-runs to succeed.
          gh release delete v${VERSION} --yes || true
          # Delete both annotated and lightweight tag syntaxes.
          git push --delete origin refs/tags/v${VERSION} || true
          git push --delete origin v${VERSION} || true
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        with:
          tag_name: v${{ env.VERSION }}
          release_name: IAM SSO 3D Lab v${{ env.VERSION }}
          body: |
            ## IAM & SSO 3D Lab v${{ env.VERSION }}

            Download the installer below and run it on any Windows 10/11 64-bit machine.

            ### Features
            - 13 hands-on labs (IAM Foundation, JML, RBAC, SSO/SAML/OIDC, MFA, Access Reviews, Break/Fix, Incident Response, PAM, Capstone, Conditional Access, Hybrid Identity Sync, Break-Glass)
            - 3D virtual environment with interactive consoles — walk up to a monitor and press E to open the VM desktop
            - AI Supervisor (Socratic coaching via local Ollama LLM — never gives answers directly)
            - Full audit trail, evidence collection, scoring rubric (100 pts, 85 to pass)

            ### AI Supervisor setup
            1. Install [Ollama](https://ollama.com)
            2. Run: `ollama pull llama3.2`
            3. The AI tutor activates automatically when Ollama is reachable at http://localhost:11434
          draft: false
          prerelease: false

  release_installer:
    name: Build & Upload Installer (Windows)
    runs-on: windows-latest
    # Same gate as create_release — electron-builder skips publishing on pull
    # requests anyway, so on a PR this job only burns a Windows runner.
    if: github.event_name == 'push'
    needs: [create_release, lint, type-check, unit, build, e2e]
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from package.json
        id: get_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # electron-builder publishes the installer AND latest.yml (the manifest
      # electron-updater actually reads) to the release for this version, with
      # filenames that match what latest.yml references.
      #
      # This replaces a manual upload-release-asset step that shipped only the
      # .exe and renamed it. Without latest.yml the in-app update check 404s and
      # can never report an update; with a renamed asset the download URL in
      # latest.yml would not resolve either.
      - name: Build & publish Electron installer
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder exits 0 even when it skips every upload — it did
      # exactly that for v0.4.0, refusing to publish into an existing
      # non-draft release while defaulting to releaseType=draft, and the job
      # still reported success. Assert the release actually carries the
      # installer and latest.yml, so a silent skip fails the build instead of
      # shipping a release nobody can update from.
      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create_release.outputs.version }}
        run: |
          assets=$(gh release view "v${VERSION}" --json assets -q '.assets[].name')
          echo "Assets on v${VERSION}:"; echo "$assets"
          for required in "IAM-SSO-3D-Lab-Setup-${VERSION}.exe" "latest.yml"; do
            echo "$assets" | grep -qx "$required" || {
              echo "::error::Release v${VERSION} is missing '$required'."
              echo "::error::electron-builder skipped publishing — check the publish step log."
              exit 1
            }
          done
          echo "Installer and update manifest are both present."
