name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# create-release / upload-release-asset need write access to repo contents;
# the default GITHUB_TOKEN permissions on this repo are read-only, which was
# failing the release job with "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run type-check

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test -- --run

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # Gate the release on every test+build job passing. Otherwise an
    # early-failing E2E (or any other job) creates a release that
    # later passes can't recreate — `actions/create-release` fails with
    # "tag_name already_exists".
    needs: [lint, type-check, unit, build, e2e]
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from package.json
        id: get_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Delete any prior release with the same tag (idempotent)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -e
          # Delete prior release + remote tag if they exist. The
          # actions/create-release action creates a git tag automatically,
          # so we must delete both the release AND the tag for re-runs to succeed.
          gh release delete v${VERSION} --yes || true
          # Delete both annotated and lightweight tag syntaxes.
          git push --delete origin refs/tags/v${VERSION} || true
          git push --delete origin v${VERSION} || true
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        with:
          tag_name: v${{ env.VERSION }}
          release_name: IAM SSO 3D Lab v${{ env.VERSION }}
          body: |
            ## IAM & SSO 3D Lab v${{ env.VERSION }}

            Download the installer below and run it on any Windows 10/11 64-bit machine.

            ### Features
            - 13 hands-on labs (IAM Foundation, JML, RBAC, SSO/SAML/OIDC, MFA, Access Reviews, Break/Fix, Incident Response, PAM, Capstone, Conditional Access, Hybrid Identity Sync, Break-Glass)
            - 3D virtual environment with interactive consoles — walk up to a monitor and press E to open the VM desktop
            - AI Supervisor (Socratic coaching via local Ollama LLM — never gives answers directly)
            - Full audit trail, evidence collection, scoring rubric (100 pts, 85 to pass)

            ### AI Supervisor setup
            1. Install [Ollama](https://ollama.com)
            2. Run: `ollama pull llama3.2`
            3. The AI tutor activates automatically when Ollama is reachable at http://localhost:11434
          draft: false
          prerelease: false

  release_installer:
    name: Build & Upload Installer (Windows)
    runs-on: windows-latest
    needs: [create_release, lint, type-check, unit, build, e2e]
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from package.json
        id: get_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Electron installer
        run: npm run build:desktop

      - name: Upload Windows installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create_release.outputs.version }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: dist-installer/IAM SSO 3D Lab-Setup-${{ env.VERSION }}.exe
          asset_name: IAM-SSO-3D-Lab-Setup-${{ env.VERSION }}.exe
          asset_content_type: application/octet-stream
