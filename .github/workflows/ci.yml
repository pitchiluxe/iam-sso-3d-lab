name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run type-check

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test -- --run

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.2.0
          release_name: IAM SSO 3D Lab v0.2.0
          body: |
            ## IAM & SSO 3D Lab v0.2.0 — VM Desktop Edition

            A realistic enterprise identity management and SSO training simulation. This release introduces a full **Virtual Machine (VM) desktop environment** — instructions, consoles, notes, and objectives are hidden until the learner presses **E** on a workstation in the 3D scene.

            ### What's new in v0.2.0
            - **VM desktop** auto-opens with AI Supervisor + Objectives windows
            - **Notepad** with line numbers, word count, and auto-save
            - **Sticky Notes** — draggable, color-coded, persistent
            - **File Explorer** with C: drive, Documents, Pictures, Downloads
            - **AIHub Browser** bundled and pre-installed — double-click the icon to launch
            - All lab instructions live **inside the VM** — nothing visible from the 3D scene until E is pressed
            - "Open Tutor" button renamed to **"Open VM & Tutor"**

            ### Features
            - 13 hands-on labs (IAM Foundation, JML, RBAC, SSO/SAML/OIDC, MFA, Access Reviews, Break/Fix, Incident Response, PAM, Capstone, Conditional Access, Hybrid Identity Sync, Break-Glass)
            - 3D virtual environment with interactive consoles
            - AI Supervisor (Socratic coaching via local Ollama LLM — never gives answers)
            - Full audit trail, evidence collection, scoring rubric (100 pts, 85 to pass)

            ### Run the installer
            Download `IAM-SSO-3D-Lab-Setup-0.2.0.exe` and run it on any Windows 10/11 64-bit machine. Includes AIHub Browser (83MB).

            ### AI Supervisor setup
            1. Install [Ollama](https://ollama.com)
            2. Run: `ollama pull llama3.2`
            3. The AI tutor activates automatically when Ollama is reachable at http://localhost:11434
          draft: false
          prerelease: false

  release_installer:
    name: Build & Upload Installer (Windows)
    runs-on: windows-latest
    needs: [create_release, unit, build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Electron installer
        run: npm run build:desktop

      - name: Upload Windows installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: dist-installer/IAM SSO 3D Lab-Setup-0.2.0.exe
          asset_name: IAM-SSO-3D-Lab-Setup-0.2.0.exe
          asset_content_type: application/octet-stream

      - name: Upload 7z archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: dist-installer/iam-sso-3d-lab-0.2.0-x64.nsis.7z
          asset_name: iam-sso-3d-lab-0.2.0-x64.nsis.7z
          asset_content_type: application/x-7z-compressed