name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# create-release / upload-release-asset need write access to repo contents;
# the default GITHUB_TOKEN permissions on this repo are read-only, which was
# failing the release job with "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run type-check

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test -- --run

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.3.1
          release_name: IAM SSO 3D Lab v0.3.1
          body: |
            ## IAM & SSO 3D Lab v0.3.1

            ### What's new in v0.3.1
            - **Generate 10 More button** — generates additional AI labs in the start screen grid
            - **AI-generated daily ticket labs** — 15 real-world IT support scenarios auto-generated per session
            - **Persisted-state v3** — improved state envelope with generatedLabs slice
            - **Bug fixes** — Objectives window deduplication, wall-sign text auto-shrinking, window guards, and more

            ### Features
            - 13 hands-on labs (IAM Foundation, JML, RBAC, SSO/SAML/OIDC, MFA, Access Reviews, Break/Fix, Incident Response, PAM, Capstone, Conditional Access, Hybrid Identity Sync, Break-Glass)
            - 3D virtual environment with interactive consoles, walk up to a monitor and press E to open the VM desktop
            - AI Supervisor (Socratic coaching via local Ollama LLM — never gives answers)
            - Full audit trail, evidence collection, scoring rubric (100 pts, 85 to pass)

            ### Run the installer
            Download `IAM-SSO-3D-Lab-Setup-0.3.1.exe` and run it on any Windows 10/11 64-bit machine.

            ### AI Supervisor setup
            1. Install [Ollama](https://ollama.com)
            2. Run: `ollama pull llama3.2`
            3. The AI tutor activates automatically when Ollama is reachable at http://localhost:11434
          draft: false
          prerelease: false

  release_installer:
    name: Build & Upload Installer (Windows)
    runs-on: windows-latest
    needs: [create_release, unit, build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Electron installer
        run: npm run build:desktop

      - name: Upload Windows installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: dist-installer/IAM SSO 3D Lab-Setup-0.3.1.exe
          asset_name: IAM-SSO-3D-Lab-Setup-0.3.1.exe
          asset_content_type: application/octet-stream